name: Server CI

# Runs on every push to any branch, so a branch's commits are checked before
# its pull request is merged. Pull requests show these same push results.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    services:
      # Throwaway Postgres for tests/test_postgres_schema.py (the startup schema
      # code uses Postgres-only SQL that SQLite can't run).
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Railway's legacy postgres:// scheme, to exercise the same URL handling as prod.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Minor version only: exact patch builds (e.g. 3.12.9) aren't
          # published for every runner OS. Railway's 3.12.x matches this.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
